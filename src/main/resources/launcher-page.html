<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Agentic Launcher</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif;
            background: #0d1117; color: #e6edf3;
            min-height: 100dvh;
            display: flex; flex-direction: column;
            align-items: center; justify-content: center;
            padding: 24px; gap: 16px;
        }
        h2 { font-size: 20px; font-weight: 600; }
        .status { color: #8b949e; font-size: 13px; text-align: center; min-height: 20px; }
        .btns { display: flex; flex-direction: column; gap: 12px; width: 100%; max-width: 320px; }
        button {
            padding: 14px;
            font-size: 16px;
            font-weight: 600;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            color: #fff;
        }
        #startBtn { background: #238636; }
        #stopBtn  { background: #da3633; }
        button:disabled { background: #21262d; color: #6e7681; }
        pre {
            width: 100%; max-width: 320px;
            background: #161b22; border: 1px solid #30363d;
            border-radius: 8px; padding: 10px;
            color: #8b949e; font-size: 12px;
            white-space: pre-wrap; word-break: break-all;
            min-height: 40px;
        }
        .open-row {
            display: flex;
            gap: 10px;
            width: 100%;
            max-width: 320px;
        }
        .open-link {
            flex: 1;
            text-align: center;
            padding: 12px;
            background: #1f6feb;
            color: #fff;
            text-decoration: none;
            border-radius: 10px;
            font-size: 14px;
            font-weight: 600;
        }
        .open-link.disabled {
            background: #21262d;
            color: #6e7681;
            pointer-events: none;
            opacity: .6;
        }
    </style>
</head>
<body>
<h2>Agentic Launcher</h2>
<div class="status" id="status">加载中…</div>
<div class="btns">
    <button id="startBtn">▶ 启动主服务</button>
    <button id="stopBtn">⏹ 停止主服务</button>
</div>

<div class="open-row">
    <a id="openDesktop" class="open-link" href="#">💻 打开电脑端</a>
    <a id="openMobile" class="open-link" href="#">📱 打开手机端</a>
</div>

<pre id="out"></pre>
<script>
    async function refresh() {
        try {
            const r = await fetch('/status');
            const s = await r.json();
            document.getElementById('status').textContent =
            s.running ? (s.ready ? '● 主服务运行中' : '◐ 主服务启动中…') : '○ 主服务未运行';
            document.getElementById('startBtn').disabled = s.running;
            document.getElementById('stopBtn').disabled = !s.running;
            const host = location.hostname + ':8080';
            const disabled = !s.ready;
            ['openDesktop', 'openMobile'].forEach(id => {
                const el = document.getElementById(id);
                if (el) el.classList.toggle('disabled', disabled);
            });
        } catch (e) {
            document.getElementById('status').textContent = '无法连接 launcher';
        }
    }
    async function act(cmd) {
        document.getElementById('out').textContent = '正在执行 ' + cmd + ' …';
        try {
            const r = await fetch('/' + cmd, { method: 'POST' });
            const t = await r.text();
            document.getElementById('out').textContent = t;
        } catch (e) {
            document.getElementById('out').textContent = '请求失败: ' + e.message;
        }
        document.getElementById('openDesktop').href = 'http://' + location.hostname + ':8080/';
        document.getElementById('openMobile').href  = 'http://' + location.hostname + ':8080/mobile/';
        refresh();
    }
    document.getElementById('startBtn').onclick = () => act('start');
    document.getElementById('stopBtn').onclick  = () => act('stop');
    refresh();
    setInterval(refresh, 3000);
</script>
</body>
</html>
