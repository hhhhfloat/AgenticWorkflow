<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Markdown 预览</title>
    <script src="marked.min.js"></script>
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0;
            font-family: -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif;
            background: #1a1a1a;
            color: #ddd;
        }
        #bar {
            position: sticky; top: 0;
            background: #222;
            padding: 10px 16px;
            display: flex;
            gap: 12px;
            align-items: center;
            border-bottom: 1px solid #333;
            z-index: 10;
            font-size: 13px;
        }
        #pathLabel { flex: 1; color: #9cdcfe; font-family: monospace; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        #reloadBtn {
            background: #4a8aff; color: #fff; border: none;
            padding: 6px 14px; border-radius: 4px; cursor: pointer;
        }
        #reloadBtn:hover { background: #5a9aff; }
        #content {
            max-width: 900px; margin: 20px auto; padding: 20px 24px;
            background: #222; border-radius: 6px; line-height: 1.7;
        }
        #content h1, #content h2, #content h3 { color: #4a8aff; margin-top: 1.5em; }
        #content h1:first-child { margin-top: 0; }
        #content code { background: #2a2a2a; padding: 2px 6px; border-radius: 3px; font-size: 0.9em; }
        #content pre { background: #1a1a1a; padding: 12px; border-radius: 4px; overflow-x: auto; }
        #content pre code { background: none; padding: 0; }
        #content ul, #content ol { padding-left: 1.5em; }
        #content li { margin: 0.3em 0; }
        #content table { border-collapse: collapse; margin: 1em 0; }
        #content th, #content td { border: 1px solid #444; padding: 6px 12px; }
        #content th { background: #2a2a2a; }
        .empty { color: #888; text-align: center; padding: 40px 0; }
        .error { color: #f88; }
    </style>
</head>
<body>
<div id="bar">
    <span id="pathLabel">加载中...</span>
    <button id="reloadBtn">↻ 刷新</button>
</div>
<div id="content"><div class="empty">加载中...</div></div>

<script>
    const content = document.getElementById('content');
    const pathLabel = document.getElementById('pathLabel');

    const params = new URLSearchParams(location.search);
    const filePath = params.get('path');

    if (!filePath) {
        content.innerHTML = '<div class="empty error">缺少 path 参数</div>';
    } else {
        pathLabel.textContent = filePath;
        loadMd(filePath);
    }

    document.getElementById('reloadBtn').addEventListener('click', () => {
        if (filePath) loadMd(filePath);
    });

    async function loadMd(path) {
        content.innerHTML = '<div class="empty">加载中...</div>';
        try {
            const res = await fetch('/' + path + '?t=' + Date.now());
            if (!res.ok) {
                content.innerHTML = '<div class="empty error">文件不存在（' + path + '）</div>';
                return;
            }
            const md = await res.text();
            if (!md.trim()) {
                content.innerHTML = '<div class="empty">文件为空</div>';
                return;
            }
            content.innerHTML = marked.parse(md, { gfm: true, breaks: true });
        } catch (err) {
            content.innerHTML = '<div class="empty error">加载失败：' + err.message + '</div>';
        }
    }
</script>
</body>
</html>
